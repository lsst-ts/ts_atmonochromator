{% set data= load_setup_py_data() %}

package:
  name: ts-atmonochromator
  version: {{ data.get('version') }}

source:
  path: ../

build:
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  string: "py{{ PY_VER | replace('.', '') }}{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"

test:
  requires:
    - ts-conda-build =0.5
    - ts-salobj {{salobj_version}}
    - ts-xml {{xml_version}}
  commands:
    - pytest
    - run_atmonochromator -h
  imports:
    - lsst.ts.atmonochromator
  source_files:
    - tests
    - pyproject.toml

requirements:
  host:
    - python {{python}}
    - pip
    - setuptools_scm ={{setuptools_scm}}
    - setuptools >={{setuptools}}
  run:
    - python {{python}}
    - setuptools
    - setuptools_scm
    - ts-xml
    - ts-salobj
    - ts-tcpip
