[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-atmonochromator"
description = "ATMonochromator is a Commandable SAL Component for the `Vera C. Rubin Observatory <https://lsst.org>`_."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
readme = "README.rst"
urls = { documentation = "https://ts-atmonochromator.lsst.io", source_code = "https://github.com/lsst-ts/ts_atmonochromator"}
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[project.scripts]
run_atmonochromator = "lsst.ts.atmonochromator:run_atmonochromator"

[tool.setuptools_scm]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.optional-dependencies]
dev = ["documenteer[pipelines]"]
